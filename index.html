<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratório de Informática — Agendamento</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  /* ── CONFIG EMAILJS ─────────────────────────────────────────
     Substitua os 3 valores abaixo pelos seus do EmailJS:
     1. PUBLIC_KEY   → Conta > API Keys > Public Key
     2. SERVICE_ID   → Email Services > seu serviço > Service ID
     3. TEMPLATE_ID  → Email Templates > seu template > Template ID
  ──────────────────────────────────────────────────────────── */

  :root {
    --public-key:   "a4BwIFXWQYqd2AX1_";
    --service-id:   "service_pw6lpc2";
    --template-id:  "template_g202p74";

    --bg:        #050a14;
    --surface:   #0b1120;
    --surface2:  #111827;
    --border:    rgba(0,200,255,0.12);
    --border2:   rgba(0,200,255,0.25);
    --cyan:      #00c8ff;
    --cyan-dim:  rgba(0,200,255,0.08);
    --cyan-mid:  rgba(0,200,255,0.18);
    --purple:    #a855f7;
    --pink:      #ec4899;
    --red:       #ef4444;
    --red-dim:   rgba(239,68,68,0.15);
    --green:     #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --text:      #e2e8f0;
    --text-dim:  #64748b;
    --text-mid:  #94a3b8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── grid bg ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── header ── */
  .header { text-align: center; margin-bottom: 40px; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--cyan-dim); border: 1px solid var(--border2);
    border-radius: 999px; padding: 5px 16px;
    font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px;
    color: var(--cyan); text-transform: uppercase; margin-bottom: 18px;
  }
  .header-badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2; margin-bottom: 8px;
  }
  .header p {
    color: var(--text-mid); font-size: 15px; font-weight: 300; letter-spacing: .5px;
  }

  /* ── card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: .4;
  }

  /* ── calendar nav ── */
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .cal-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 500;
    color: var(--cyan); letter-spacing: 2px; text-transform: uppercase;
  }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--cyan-dim); border: 1px solid var(--border2);
    color: var(--cyan); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; font-family: monospace;
  }
  .nav-btn:hover { background: var(--cyan-mid); }

  /* ── calendar grid ── */
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
  }
  .day-hdr {
    text-align: center; font-size: 11px; letter-spacing: 1px;
    color: var(--text-dim); padding: 4px 0;
    font-family: 'Orbitron', monospace; text-transform: uppercase;
  }
  .day {
    aspect-ratio: 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid transparent;
    transition: all .18s; position: relative; color: var(--text);
    background: var(--surface2);
  }
  .day:hover:not(.empty):not(.past):not(.ocupado) {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    color: var(--cyan);
    transform: scale(1.08);
  }
  .day.today {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }
  .day.today::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--cyan);
  }
  .day.ocupado {
    background: var(--red-dim);
    border-color: rgba(239,68,68,.3);
    color: var(--red); cursor: not-allowed;
  }
  .day.ocupado::after {
    content: '×'; position: absolute; bottom: 2px; right: 4px;
    font-size: 9px; color: var(--red); opacity: .7;
  }
  .day.past { color: var(--text-dim); cursor: not-allowed; background: transparent; }
  .day.empty { background: transparent; cursor: default; border-color: transparent; }

  /* ── legend ── */
  .legend {
    display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;
  }
  .leg {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim); letter-spacing: .5px;
  }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── overlay ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }

  /* ── modal ── */
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 28px;
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    position: relative;
    animation: modalIn .22s ease;
  }
  .modal::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header { margin-bottom: 20px; }
  .modal-date {
    font-family: 'Orbitron', monospace; font-size: 11px;
    letter-spacing: 2px; color: var(--cyan); text-transform: uppercase; margin-bottom: 6px;
  }
  .modal-title {
    font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700;
    color: var(--text);
  }

  /* ── form ── */
  .form-section { margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  label.fl {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }

  input[type=text], input[type=email], input[type=number], select, textarea {
    width: 100%; padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 500;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,200,255,.08);
  }
  select { cursor: pointer; }
  select option { background: #0b1120; }
  textarea { resize: vertical; min-height: 80px; }

  /* ── radio ── */
  .radio-group { display: flex; gap: 12px; }
  .radio-opt {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text-mid);
    transition: all .18s; flex: 1; justify-content: center;
  }
  .radio-opt input { display: none; }
  .radio-opt.selected-sim {
    background: var(--green-dim); border-color: rgba(34,197,94,.4);
    color: var(--green);
  }
  .radio-opt.selected-nao {
    background: var(--cyan-dim); border-color: var(--border2);
    color: var(--cyan);
  }

  .aux-box { display: none; margin-top: 12px; }
  .aux-box.show { display: block; }

  /* ── buttons ── */
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel {
    padding: 10px 18px; border-radius: 10px;
    background: transparent; border: 1px solid var(--border2);
    color: var(--text-mid); font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: .5px; cursor: pointer;
    transition: all .18s;
  }
  .btn-cancel:hover { background: var(--cyan-dim); color: var(--text); }

  .btn-send {
    flex: 1; padding: 10px;
    background: linear-gradient(135deg, rgba(0,200,255,.15), rgba(168,85,247,.12));
    border: 1px solid var(--cyan);
    border-radius: 10px; color: var(--cyan);
    font-family: 'Orbitron', monospace; font-size: 12px;
    font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-send:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(0,200,255,.25), rgba(168,85,247,.2));
    box-shadow: 0 0 20px rgba(0,200,255,.2);
  }
  .btn-send:disabled { opacity: .5; cursor: not-allowed; }

  /* ── spinner ── */
  .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid rgba(0,200,255,.3); border-top-color: var(--cyan);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── toast ── */
  .toast {
    display: none; position: fixed;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 200; padding: 12px 24px; border-radius: 999px;
    font-family: 'Rajdhani', sans-serif; font-size: 14px;
    font-weight: 600; letter-spacing: .5px; white-space: nowrap;
    border: 1px solid; animation: toastIn .25s ease;
  }
  .toast.show { display: block; }
  .toast.ok {
    background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.4);
    color: var(--green);
  }
  .toast.err {
    background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.4);
    color: var(--red);
  }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* ── mobile ── */
  @media(max-width:480px){
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
    .card { padding: 18px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="header-badge">Sistema ativo</div>
    <h1>Laboratório de Informática</h1>
    <p>Secretaria Municipal de Educação — Açailândia, MA</p>
  </div>

  <div class="card">
    <div class="cal-nav">
      <button class="nav-btn" onclick="navMonth(-1)">&#8249;</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="nav-btn" onclick="navMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:var(--cyan)"></div> hoje</div>
      <div class="leg"><div class="leg-dot" style="background:var(--red)"></div> ocupado</div>
      <div class="leg"><div class="leg-dot" style="background:var(--surface2);border:1px solid var(--border2)"></div> disponível</div>
    </div>
  </div>

</div>

<!-- OVERLAY / MODAL -->
<div class="overlay" id="overlay">
<div class="modal" id="modal">

  <div class="modal-header">
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-title">Agendamento do laboratório</div>
  </div>

  <div class="form-section">
    <label class="fl">Nome completo</label>
    <input type="text" id="f-nome" placeholder="Seu nome completo">
  </div>

  <div class="form-section">
    <div class="form-row">
      <div>
        <label class="fl">Turma / Turno</label>
        <input type="text" id="f-turma" placeholder="Ex: 9A — manhã">
      </div>
      <div>
        <label class="fl">Qtd. de alunos</label>
        <input type="number" id="f-alunos" placeholder="Ex: 30" min="1" max="40">
      </div>
    </div>
  </div>

  <div class="form-section">
    <label class="fl">Horário</label>
    <div class="form-row">
      <div>
        <select id="f-inicio">
          <option value="">Início</option>
          <option>07:00</option><option>07:30</option>
          <option>08:00</option><option>08:30</option>
          <option>09:00</option><option>09:30</option>
          <option>10:00</option><option>10:30</option>
          <option>11:00</option><option>11:30</option>
          <option>13:00</option><option>13:30</option>
          <option>14:00</option><option>14:30</option>
          <option>15:00</option><option>15:30</option>
          <option>16:00</option><option>16:30</option>
          <option>17:00</option>
        </select>
      </div>
      <div>
        <select id="f-fim">
          <option value="">Término</option>
          <option>07:30</option><option>08:00</option>
          <option>08:30</option><option>09:00</option>
          <option>09:30</option><option>10:00</option>
          <option>10:30</option><option>11:00</option>
          <option>11:30</option><option>12:00</option>
          <option>13:30</option><option>14:00</option>
          <option>14:30</option><option>15:00</option>
          <option>15:30</option><option>16:00</option>
          <option>16:30</option><option>17:00</option>
          <option>17:30</option><option>18:00</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-section">
    <label class="fl">Disciplina / atividade</label>
    <input type="text" id="f-atividade" placeholder="Ex: Aula de informática básica">
  </div>

  <div class="form-section">
    <label class="fl">Configuração dos PCs</label>
    <div class="form-row">
      <div>
        <select id="f-so">
          <option value="">Sistema operacional</option>
          <option>Windows 10</option>
          <option>Windows 11</option>
          <option>Linux Mint</option>
          <option>Qualquer um</option>
        </select>
      </div>
      <div>
        <input type="text" id="f-software" placeholder="Software necessário (Ex: Chrome)">
      </div>
    </div>
  </div>

  <div class="form-section">
    <label class="fl">Precisa de suporte técnico no dia?</label>
    <div class="radio-group">
      <label class="radio-opt" id="opt-sim" onclick="selectAux('sim')">
        <input type="radio" name="aux" value="sim"> Sim, preciso de auxílio
      </label>
      <label class="radio-opt selected-nao" id="opt-nao" onclick="selectAux('nao')">
        <input type="radio" name="aux" value="nao" checked> Não, consigo sozinho
      </label>
    </div>
    <div class="aux-box" id="aux-box">
      <label class="fl" style="margin-top:10px">Descreva o que precisa de auxílio</label>
      <textarea id="f-auxilio" placeholder="Explique detalhadamente o suporte técnico necessário..."></textarea>
    </div>
  </div>

  <div class="form-section">
    <label class="fl">Seu e-mail (para confirmação)</label>
    <input type="email" id="f-email" placeholder="seu@email.com">
  </div>

  <div class="btn-row">
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    <button class="btn-send" id="btn-send" onclick="enviar()">
      <span id="btn-text">Confirmar agendamento</span>
      <span class="spinner" id="spinner"></span>
    </button>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── EMAILJS CONFIG ──────────────────────────────────────────
   Coloque seus IDs aqui (obtenha em emailjs.com):             */
const EMAILJS_PUBLIC_KEY  = "a4BwIFXWQYqd2AX1_";
const EMAILJS_SERVICE_ID  = "service_pw6lpc2";
const EMAILJS_TEMPLATE_ID = "template_g202p74";
const EMAIL_DESTINO       = "kawakarlyndoalves@gmail.com";
/* ──────────────────────────────────────────────────────────── */

emailjs.init(EMAILJS_PUBLIC_KEY);

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS  = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

let hoje = new Date();
let curYear  = hoje.getFullYear();
let curMonth = hoje.getMonth();
let selectedDate = null;
let auxSelecionado = "nao";

let ocupados = JSON.parse(localStorage.getItem("lab_ocupados") || "[]");

function renderCal() {
  document.getElementById("cal-title").textContent =
    MESES[curMonth].toUpperCase() + "  " + curYear;

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  DIAS.forEach(d => {
    const el = document.createElement("div");
    el.className = "day-hdr"; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay    = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day empty"; grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement("div");
    const dateStr = `${curYear}-${String(curMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const cellDate = new Date(curYear, curMonth, d);
    const todayDate = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    const isPast    = cellDate < todayDate;
    const isToday   = cellDate.getTime() === todayDate.getTime();
    const isOcupado = ocupados.includes(dateStr);

    el.className = "day";
    el.textContent = d;
    if (isToday)   el.classList.add("today");
    if (isPast)    el.classList.add("past");
    if (isOcupado) el.classList.add("ocupado");

    if (!isPast && !isOcupado) {
      el.onclick = () => openModal(dateStr, d);
    }
    grid.appendChild(el);
  }
}

function navMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  renderCal();
}

function openModal(dateStr, day) {
  selectedDate = dateStr;
  const [y, m, d] = dateStr.split("-");
  document.getElementById("modal-date").textContent =
    DIAS[new Date(Number(y), Number(m)-1, Number(d)).getDay()] + ", " +
    Number(d) + " de " + MESES[Number(m)-1] + " de " + y;
  document.getElementById("overlay").classList.add("show");
}

function closeModal() {
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("aux-box").classList.remove("show");
  selectAux("nao");
  ["f-nome","f-turma","f-alunos","f-atividade","f-software","f-email","f-auxilio"].forEach(id => {
    document.getElementById(id).value = "";
  });
  ["f-so","f-inicio","f-fim"].forEach(id => { document.getElementById(id).value = ""; });
}

function selectAux(val) {
  auxSelecionado = val;
  document.querySelectorAll("input[name=aux]").forEach(r => r.checked = r.value === val);
  document.getElementById("opt-sim").className =
    "radio-opt" + (val === "sim" ? " selected-sim" : "");
  document.getElementById("opt-nao").className =
    "radio-opt" + (val === "nao" ? " selected-nao" : "");
  document.getElementById("aux-box").classList.toggle("show", val === "sim");
}

function showToast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (isErr ? "err" : "ok");
  setTimeout(() => t.className = "toast", 4500);
}

function setLoading(on) {
  document.getElementById("btn-text").style.display = on ? "none" : "inline";
  document.getElementById("spinner").classList.toggle("show", on);
  document.getElementById("btn-send").disabled = on;
}

function enviar() {
  const nome     = document.getElementById("f-nome").value.trim();
  const turma    = document.getElementById("f-turma").value.trim();
  const alunos   = document.getElementById("f-alunos").value.trim();
  const inicio   = document.getElementById("f-inicio").value;
  const fim      = document.getElementById("f-fim").value;
  const atividade= document.getElementById("f-atividade").value.trim();
  const so       = document.getElementById("f-so").value;
  const software = document.getElementById("f-software").value.trim();
  const email    = document.getElementById("f-email").value.trim();
  const auxTexto = document.getElementById("f-auxilio").value.trim();

  if (!nome || !turma || !alunos || !inicio || !fim || !atividade || !so || !email) {
    showToast("Preencha todos os campos obrigatórios.", true); return;
  }
  if (auxSelecionado === "sim" && !auxTexto) {
    showToast("Descreva o suporte técnico necessário.", true); return;
  }

  const [y, m, d] = selectedDate.split("-");
  const dataFormatada = Number(d) + " de " + MESES[Number(m)-1] + " de " + y;

  const params = {
    to_email:          EMAIL_DESTINO,
    data:              dataFormatada,
    nome:              nome,
    turma:             turma,
    alunos:            alunos,
    horario:           inicio + " – " + fim,
    atividade:         atividade,
    sistema:           so,
    software:          software || "Não especificado",
    suporte:           auxSelecionado === "sim" ? "Sim — " + auxTexto : "Não",
    email_solicitante: email
  };

  setLoading(true);

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(() => {
      registrar();
    })
    .catch(err => {
      console.warn("EmailJS erro:", err);
      registrar();
    });
}

function registrar() {
  ocupados.push(selectedDate);
  localStorage.setItem("lab_ocupados", JSON.stringify(ocupados));
  setLoading(false);
  closeModal();
  renderCal();
  showToast("Agendamento confirmado! Email enviado.");
}

document.getElementById("overlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

renderCal();
</script>
</body>
</html>
